# 构建与测试。目前只在手动触发时跑：
# 这个 GitHub 账户的 Actions 账单没结清，push 触发会直接判失败（job 不会启动）。
# 账单处理完之后，把下面的 push / pull_request 打开即可。
name: Build

on:
  workflow_dispatch:
  # push:
  # pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-apk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: zhiji-apk
          path: build/app/outputs/flutter-apk/app-release.apk
